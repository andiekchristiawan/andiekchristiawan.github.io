
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ULAR ANDIEK</title>
<style>
body{background:#000;color:#00f0ff;font-family:Arial;text-align:center;padding:20px}
canvas{background:#111;border:3px solid #00f0ff;border-radius:10px}
.btn{padding:15px 20px;font-size:22px;border:none;border-radius:10px;background:#00f0ff;margin:5px;font-weight:bold}
</style>
</head>
<body>
<h1>GAME ULAR - ANDIEK</h1>
<p>SKOR: <span id="skor">0</span></p>
<canvas id="game" width="300" height="300"></canvas>
<br><br>
<button class="btn" onclick="startGame()">MULAI MAIN</button>
<br><br>
<button class="btn" onclick="arah(0,-1)">ATAS</button><br>
<button class="btn" onclick="arah(-1,0)">KIRI</button>
<button class="btn" onclick="arah(1,0)">KANAN</button><br>
<button class="btn" onclick="arah(0,1)">BAWAH</button>
<br><br>
<button class="btn" style="background:#ff0055;color:#fff" onclick="location.reload()">ULANG</button>
<script>
var cv=document.getElementById("game");
var ctx=cv.getContext("2d");
var snake=[{x:140,y:140},{x:120,y:140},{x:100,y:140}];
var dx=0,dy=0,food={x:220,y:220},skor=0,run=false;
function draw(){
ctx.fillStyle="#111";ctx.fillRect(0,0,300,300);
ctx.fillStyle="red";ctx.fillRect(food.x,food.y,20,20);
ctx.fillStyle="#00f0ff";
for(var i=0;i<snake.length;i++){ctx.fillRect(snake[i].x+1,snake[i].y+1,18,18);}
}
draw();
function startGame(){
if(run) return;
run=true;dx=20;dy=0;gameLoop();
}
function arah(a,b){
if(!run){startGame();return;}
if(a==1&&dx==-20)return;
if(a==-1&&dx==20)return;
if(b==1&&dy==-20)return;
if(b==-1&&dy==20)return;
dx=a*20;dy=b*20;
}
function gameLoop(){
if(!run) return;
var head={x:snake[0].x+dx,y:snake[0].y+dy};
if(head.x<0||head.x>=300||head.y<0||head.y>=300){
run=false;alert("GAME OVER Skor:"+skor);return;
}
for(var i=0;i<snake.length;i++){
if(snake[i].x==head.x&&snake[i].y==head.y){run=false;alert("GAME OVER Skor:"+skor);return;}
}
snake.unshift(head);
if(head.x==food.x&&head.y==food.y){
skor+=10;document.getElementById("skor").innerText=skor;
food={x:Math.floor(Math.random()*15)*20,y:Math.floor(Math.random()*15)*20};
}else{snake.pop();}
draw();
setTimeout(gameLoop,160);
}
</script>
</body>
</html>
