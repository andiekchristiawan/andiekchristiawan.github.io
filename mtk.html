<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{background:#0f172a;color:#fff;font-family:sans-serif;text-align:center;padding:20px}.card{background:#1e293b;padding:20px;border-radius:15px;max-width:500px;margin:auto}button{display:block;width:100%;padding:12px;margin:8px 0;border:none;border-radius:10px;font-size:16px;font-weight:bold}input{padding:12px;width:90%;border-radius:10px;border:none;text-align:center;font-size:16px}#tm{color:#facc15;font-weight:bold}</style></head><body><h1>GAME MTK KELAS 5</h1><div class="card" id="box"><h2>Siapa Nama Kamu?</h2><input id="nm" placeholder="Tulis nama..."><button onclick="mulai()" style="background:#facc15">MULAI MAIN</button></div><script>
let q=[["12 x 8 = ?","96","86","104","98",0],["144 : 12 = ?","12","14","11","13",0],["3/4 + 1/4 = ?","1","4/4 = 1","2/4","1/2",1],["KPK dari 4 dan 6?","12","24","6","18",0],["FPB dari 12 dan 18?","6","3","12","9",0],["0,5 + 0,25 = ?","0,75","0,55","0,30","1",0],["25% dari 200?","50","25","75","100",0],["7 x 7 + 5 = ?","54","49","56","59",0],["Keliling persegi sisi 9 cm?","36 cm","81 cm","18 cm","27 cm",0],["1000 - 345 = ?","655","665","645","755",0]];
let i=0,s=0,l=false,nama="",t,det=15;
function mulai(){nama=document.getElementById('nm').value||"Anonim";tampil();}
function tampil(){l=false;det=15;document.getElementById('box').innerHTML='<p id="tm">Waktu: 15 detik | Skor: '+s+'</p><p>'+nama+' | Soal '+(i+1)+'/10</p><h2>'+q[i][0]+'</h2><div id="ops"></div><p id="msg"></p><button onclick="next()" id="nb" style="display:none;background:#4ade80">LANJUT</button>';let h='';for(let j=0;j<4;j++)h+='<button onclick="jawab('+j+',this)">'+q[i][j+1]+'</button>';document.getElementById('ops').innerHTML=h;clearInterval(t);t=setInterval(()=>{det--;let e=document.getElementById('tm');if(e)e.innerHTML='Waktu: '+det+' detik | Skor: '+s;if(det<=0){clearInterval(t);document.getElementById('msg').innerHTML='WAKTU HABIS! Jawabannya: '+q[i][q[i][5]+1];l=true;document.getElementById('nb').style.display='block';}},1000);}
function jawab(j,e){if(l)return;l=true;clearInterval(t);if(j==q[i][5]){s+=10;e.style.background='#4ade80';document.getElementById('msg').innerHTML='BETUL! +10';}else{e.style.background='#f87171';document.getElementById('msg').innerHTML='SALAH! Jawabannya: '+q[i][q[i][5]+1];}document.getElementById('nb').style.display='block';}
function next(){i++;if(i>=q.length){clearInterval(t);let lb=JSON.parse(localStorage.getItem('lb_mtk')||'[]');lb.push(nama+': '+s);lb.sort((a,b)=>parseInt(b.split(':')[1])-parseInt(a.split(':')[1]));lb=lb.slice(0,3);localStorage.setItem('lb_mtk',JSON.stringify(lb));document.getElementById('box').innerHTML='<h1>SELESAI '+nama+'!</h1><h2>Skor: '+s+'/100</h2><p>'+(s>=80?'JENIUS MTK!':s>=50?'LUMAYAN!':'BELAJAR LAGI YA!')+'</p><h3>TOP 3 MTK:</h3><p>'+lb.join('<br>')+'</p><button onclick="location.reload()" style="background:#facc15">MAIN LAGI</button>';}else tampil();}
</script></body></html>
